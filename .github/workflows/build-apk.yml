name: Build APK

on:
  push:
    paths:
      - '**.zip'
      - '**.ZIP'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pick the newest zip (name does not matter)
        run: |
          ZIP=""
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then ZIP="$f"; break; fi
          done < <(git -c core.quotepath=false log --diff-filter=ACMR --name-only --format='' -- '*.zip' '*.ZIP')
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname '*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          fi
          [ -n "$ZIP" ] || { echo "No zip file found"; exit 1; }
          echo "Using: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Unzip and detect project type
        id: detect
        run: |
          rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          unzip -q -o "$ZIP_PATH" -d "$RUNNER_TEMP/src"
          rm -rf "$RUNNER_TEMP/src/__MACOSX"

          S="$RUNNER_TEMP/src"
          ROOT=""; TYPE=""
          P="$(find "$S" -maxdepth 4 -name pubspec.yaml -not -path '*/.*' -not -path '*/node_modules/*' | head -n 1)"
          if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=flutter; fi
          if [ -z "$ROOT" ]; then
            P="$(find "$S" -maxdepth 4 \( -name capacitor.config.json -o -name capacitor.config.ts -o -name capacitor.config.js \) -not -path '*/node_modules/*' | head -n 1)"
            if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=capacitor; fi
          fi
          if [ -z "$ROOT" ]; then
            P="$(find "$S" -maxdepth 4 -name gradlew -not -path '*/node_modules/*' | head -n 1)"
            if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=android; fi
          fi
          [ -n "$ROOT" ] || { echo "Could not detect a Flutter / Capacitor / Android project inside the zip"; exit 1; }

          cp -a "$ROOT/." "$RUNNER_TEMP/app/"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "APP_DIR=$RUNNER_TEMP/app" >> "$GITHUB_ENV"
          echo "Detected: $TYPE"

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.type == 'flutter'
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'capacitor'
        with:
          node-version: '20'

      - name: Prepare permanent signing key
        run: |
          if [ ! -f .signing/release.jks ]; then
            mkdir -p .signing
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore .signing/release.jks -alias release \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Naqi App, O=Naqi, C=IQ"
            echo "$PASS" > .signing/pass.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .signing
            git commit -m "Add permanent signing key"
            git push
          fi
          echo "KS_PATH=$GITHUB_WORKSPACE/.signing/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$(cat .signing/pass.txt)" >> "$GITHUB_ENV"

      - name: Version code (always increasing)
        run: |
          VC=$((GITHUB_RUN_NUMBER + 100))
          echo "NAQI_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/versioncode.gradle <<'GRADLE'
          allprojects {
            pluginManager.withPlugin('com.android.application') {
              def ac = extensions.findByName('androidComponents')
              if (ac != null) {
                ac.onVariants(ac.selector().all(), { v ->
                  v.outputs.each { o ->
                    o.versionCode.set(Integer.parseInt(System.getenv('NAQI_VERSION_CODE')))
                  }
                })
              }
            }
          }
          GRADLE
          cat > ~/.gradle/init.d/nolint.gradle <<'GRADLE'
          allprojects {
            afterEvaluate {
              tasks.matching { it.name.startsWith('lintVital') }.configureEach { it.enabled = false }
            }
          }
          GRADLE

      - name: Prepare Flutter project
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.APP_DIR }}
        run: |
          NAME="$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')"
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name "$NAME"
          fi
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          fi
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/' "$M"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Naqi Pro Plus"/' "$M"
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$G" ] && sed -i -E 's/applicationId( =)? *"[^"]*"/applicationId\1 "com.naqi.proplus"/' "$G"
          done
          grep -n applicationId android/app/build.gradle* || true

          GP=android/gradle.properties
          touch "$GP"
          sed -i '/^android\.newDsl=/d;/^android\.builtInKotlin=/d' "$GP"
          printf '\nandroid.newDsl=false\nandroid.builtInKotlin=false\n' >> "$GP"
          sed -i '/^org\.gradle\.jvmargs=/d' "$GP"
          echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError' >> "$GP"
          cat "$GP"

          if [ -f native/apply_native.py ]; then
            python3 native/apply_native.py .
          fi
          flutter --version
          flutter pub get

      - name: Analyze Dart (shows real code errors)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.log" || true
          ERR="$(grep -E '^\s*error •' "$RUNNER_TEMP/analyze.log" | head -40 || true)"
          if [ -n "$ERR" ]; then
            {
              echo '### Dart errors (flutter analyze)'
              echo '```'
              echo "$ERR"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$ERR" | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      - name: Build Flutter
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          flutter build apk --release --no-shrink --target-platform android-arm64,android-arm --build-number="$NAQI_VERSION_CODE" 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            PAT='\.dart:[0-9]+:[0-9]+: Error|^e: |error:|Error:|What went wrong|Caused by|Execution failed|Could not |Unresolved reference|cannot be cast|Failed to apply plugin|OutOfMemory|Daemon disappeared|Compilation failed|Target .* failed'
            {
              echo '### Build failed - real errors'
              echo '```'
              grep -nE "$PAT" "$RUNNER_TEMP/build.log" | head -60
              echo '```'
              echo '#### What went wrong'
              echo '```'
              grep -A12 -m1 'What went wrong' "$RUNNER_TEMP/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "$PAT" "$RUNNER_TEMP/build.log" | grep -v 'What went wrong' | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$RC"
          fi
          echo "RAW_APK=$(pwd)/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"

      - name: Build Capacitor
        if: steps.detect.outputs.type == 'capacitor'
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci || npm install
          npm run build --if-present
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "RAW_APK=$(find . -path '*outputs/apk/release*' -name '*.apk' | head -n 1 | xargs realpath)" >> "$GITHUB_ENV"

      - name: Build native Android
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "RAW_APK=$(find . -path '*outputs/apk/release*' -name '*.apk' | head -n 1 | xargs realpath)" >> "$GITHUB_ENV"

      - name: Verify raw APK exists
        run: |
          [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ] || { echo "APK not found: $RAW_APK"; exit 1; }
          SIZE=$(stat -c%s "$RAW_APK")
          echo "Raw APK size: $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "APK too small, build is broken"; exit 1; }
          unzip -tq "$RAW_APK"

      - name: Align and sign
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          OUT="out/app-build-${GITHUB_RUN_NUMBER}.apk"
          "$BT/zipalign" -f -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$KS_PATH" --ks-pass "pass:$KS_PASS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          "$BT/zipalign" -c -p 4 "$OUT"
          unzip -tq "$OUT"
          ls -lh out/
          "$BT/aapt" dump badging "$OUT" | grep -E "^package|sdkVersion|targetSdkVersion|application-label:|native-code" || true
          "$BT/apksigner" verify --print-certs "$OUT" | head -5
          echo "SHA256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          echo "SIZE: $(stat -c%s "$OUT")"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_FILE" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "versionCode ${NAQI_VERSION_CODE}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-build-${GITHUB_RUN_NUMBER}.apk"
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(stat -c%s "$APK_FILE") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $(sha256sum "$APK_FILE" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
