name: Build APK

# ضع هذا الملف في: .github/workflows/build-apk.yml
# ثم ارفع أي ملف ZIP (بأي اسم: name.zip / name-(1).zip / name-(20).zip ...) إلى المستودع وسيبدأ البناء تلقائيًا.

on:
  push:
    paths:
      - '**.zip'
      - '**.ZIP'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 1) اختيار ملف ZIP بغض النظر عن اسمه ----------
      - name: Pick the zip (name does not matter)
        run: |
          ZIP=""
          while IFS= read -r f; do
            case "$f" in *.zip|*.ZIP) ZIP="$f" ;; esac
          done < <(git -c core.quotepath=false diff-tree --no-commit-id --name-only -r --root HEAD)
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f \( -iname '*.zip' \) -not -path './.git/*' | sort | tail -n 1)"
          fi
          [ -n "$ZIP" ] || { echo "No zip file found"; exit 1; }
          echo "Using: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      # ---------- 2) فك الضغط ونسخ المشروع إلى مجلد ثابت الاسم ----------
      - name: Unzip and detect project type
        id: detect
        run: |
          rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          unzip -q -o "$ZIP_PATH" -d "$RUNNER_TEMP/src"
          rm -rf "$RUNNER_TEMP/src/__MACOSX"

          S="$RUNNER_TEMP/src"
          ROOT=""; TYPE=""
          P="$(find "$S" -maxdepth 4 -name pubspec.yaml -not -path '*/.*' -not -path '*/node_modules/*' | head -n 1)"
          if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=flutter; fi
          if [ -z "$ROOT" ]; then
            P="$(find "$S" -maxdepth 4 \( -name capacitor.config.json -o -name capacitor.config.ts -o -name capacitor.config.js \) -not -path '*/node_modules/*' | head -n 1)"
            if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=capacitor; fi
          fi
          if [ -z "$ROOT" ]; then
            P="$(find "$S" -maxdepth 4 -name gradlew -not -path '*/node_modules/*' | head -n 1)"
            if [ -n "$P" ]; then ROOT="$(dirname "$P")"; TYPE=android; fi
          fi
          [ -n "$ROOT" ] || { echo "Could not detect a Flutter / Capacitor / Android project inside the zip"; exit 1; }

          cp -a "$ROOT/." "$RUNNER_TEMP/app/"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "APP_DIR=$RUNNER_TEMP/app" >> "$GITHUB_ENV"
          echo "Detected: $TYPE"

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.type == 'flutter'
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'capacitor'
        with:
          node-version: '20'

      # ---------- 3) مفتاح توقيع ثابت (حتى يتثبت التحديث فوق النسخة القديمة) ----------
      - name: Prepare permanent signing key
        run: |
          if [ ! -f .signing/release.jks ]; then
            mkdir -p .signing
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore .signing/release.jks -alias release \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Naqi App, O=Naqi, C=IQ"
            echo "$PASS" > .signing/pass.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .signing
            git commit -m "Add permanent signing key"
            git push
          fi
          echo "KS_PATH=$GITHUB_WORKSPACE/.signing/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$(cat .signing/pass.txt)" >> "$GITHUB_ENV"

      # ---------- 4) رقم إصدار يزيد دائمًا ----------
      - name: Version code (always increasing)
        run: |
          VC=$((GITHUB_RUN_NUMBER + 100))
          echo "NAQI_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/versioncode.gradle <<'EOF'
          allprojects {
            pluginManager.withPlugin('com.android.application') {
              def ac = extensions.findByName('androidComponents')
              if (ac != null) {
                ac.onVariants(ac.selector().all(), { v ->
                  v.outputs.each { o ->
                    o.versionCode.set(Integer.parseInt(System.getenv('NAQI_VERSION_CODE')))
                  }
                })
              }
            }
          }
          EOF

      # ---------- 5) البناء ----------
      - name: Build Flutter
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.APP_DIR }}
        run: |
          NAME="$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')"
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name "$NAME"
          fi
          # Release builds from `flutter create` lack INTERNET permission: add it
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Naqi Pro Plus"/' "$M"
          flutter pub get
          flutter build apk --release --build-number="$NAQI_VERSION_CODE"
          echo "RAW_APK=$(pwd)/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"

      - name: Build Capacitor
        if: steps.detect.outputs.type == 'capacitor'
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci || npm install
          npm run build --if-present
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "RAW_APK=$(find . -path '*outputs/apk/release*' -name '*.apk' | head -n 1 | xargs realpath)" >> "$GITHUB_ENV"

      - name: Build native Android
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "RAW_APK=$(find . -path '*outputs/apk/release*' -name '*.apk' | head -n 1 | xargs realpath)" >> "$GITHUB_ENV"

      # ---------- 6) محاذاة وتوقيع ----------
      - name: Align and sign
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$KS_PATH" --ks-pass "pass:$KS_PASS" \
            --out "out/app-build-${GITHUB_RUN_NUMBER}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "out/app-build-${GITHUB_RUN_NUMBER}.apk"

      # ---------- 7) نشر APK مباشرة (بدون ZIP) ----------
      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "out/app-build-${GITHUB_RUN_NUMBER}.apk" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "versionCode ${NAQI_VERSION_CODE}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-build-${GITHUB_RUN_NUMBER}.apk"
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
